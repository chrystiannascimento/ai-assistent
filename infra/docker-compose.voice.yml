services:
  openwakeword:
    container_name: openwakeword
    image: rhasspy/wyoming-openwakeword:latest
    restart: unless-stopped
    ports:
      - "10400:10400"
    volumes:
      - openwakeword-data:/data
    command: --uri tcp://0.0.0.0:10400 --preload-model ok_nabu
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/10400'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  whisper:
    container_name: whisper
    image: rhasspy/wyoming-whisper:latest
    restart: unless-stopped
    ports:
      - "10300:10300"
    volumes:
      - whisper-data:/data
    command: --model small-int8 --language pt --uri tcp://0.0.0.0:10300
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/10300'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  piper:
    container_name: piper
    image: rhasspy/wyoming-piper:latest
    restart: unless-stopped
    ports:
      - "10200:10200"
    volumes:
      - piper-data:/data
    command: --voice pt_BR-faber-medium --uri tcp://0.0.0.0:10200
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/10200'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  openwakeword-data:
  whisper-data:
  piper-data:
