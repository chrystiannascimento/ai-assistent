services:
  litellm:
    container_name: litellm
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ../orchestrator/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  presidio-analyzer:
    container_name: presidio-analyzer
    image: mcr.microsoft.com/presidio-analyzer:latest
    restart: unless-stopped
    ports:
      - "5001:3000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  presidio-anonymizer:
    container_name: presidio-anonymizer
    image: mcr.microsoft.com/presidio-anonymizer:latest
    restart: unless-stopped
    ports:
      - "5002:3000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
